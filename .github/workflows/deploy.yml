name: Deploy to BKNS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Normalize BKNS FTP path
      shell: bash
      env:
        FTP_REMOTE_PATH: ${{ secrets.FTP_REMOTE_PATH }}
      run: printf 'FTP_REMOTE_PATH=%s/\n' "${FTP_REMOTE_PATH%/}" >> "$GITHUB_ENV"

    - name: Deploy to BKNS FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_HOST }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./
        server-dir: ${{ env.FTP_REMOTE_PATH }}
        dangerous-clean-slate: false
    
    - name: Deployment Success
      if: success()
      run: echo "✅ Deployment to BKNS successful!"
    
    - name: Deployment Failed
      if: failure()
      run: echo "❌ Deployment to BKNS failed! Check FTP credentials."
